<html>
  <head>
    <style></style>
  </head>
  <body>

    <br>

    <div class="mb-3">
      <a href="http://127.0.0.1:5500/example/oc/html_template/home.html" class="btn  btn-sm">
        <i class="fas fa-arrow-left"></i> Home
      </a>
    </div>

    <!-- SILVIA (SKG-IF): same layout as Pietro's; the fields are filled by
         api_author_record_skgif() in localbrowser.js (ids below) instead of
         [[Lucinda:...]] SPARQL values -->
    <div class="row">

      <div class="col-12 mb-4">
        <div class="card shadow-sm p-3 h-100">
          <div class="card-header text-center">
            <!-- SILVIA (SKG-IF): as the document page: Pietro's label small
                 above, the name instead of the OMID (api_author_record_skgif());
                 the identifiers are in the card below -->
            <p class="mb-1 small text-muted">Responsible Agent Record</p>
            <h3 class="my-0" id="ra-id"></h3>
          </div>
        </div>
      </div>

      <!-- errors (no author with this OMID, failed request) -->
      <div class="col-12" id="ra-message"></div>

    </div>

    <!-- SILVIA (SKG-IF): layout of 2026-10-17, aligned with the document
         page (no "Author Profile" header, labels as br-label). Left: name,
         ORCID, other identifiers and the Publications counter (same box as
         the document's References/Citations); right: the "Publications per
         year" chart as wide as its card, so the two cards have about the same
         height. Filled by api_author_record_skgif() / _loadAuthorWorks(). -->
    <div class="row d-none" id="ra-record">

      <div class="col-12 col-lg-5 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body p-4">

            <h4 class="br-title mb-3" id="ra-name"></h4>

            <div class="br-field mb-3"><span class="br-label">ORCID</span><span id="ra-orcid"></span></div>
            <!-- Pietro's query already read the other identifiers (otherIDs)
                 but did not show them -->
            <div class="br-field mb-3"><span class="br-label">Other identifiers</span><span id="ra-ids"></span></div>

            <div class="card shadow-sm ra-count-box">
              <div class="card-header text-center py-1"><span class="fw-bold small">Publications</span></div>
              <div class="card-body text-center py-1"><h3 class="text-primary my-1" id="search-total-count"></h3></div>
            </div>

          </div>
        </div>
      </div>

      <!-- Pietro's "Publications per year" chart; drawn by _loadAuthorWorks()
           from the dates of all the works (SKG-IF, every role) once they have
           all arrived -->
      <div class="col-12 col-lg-7 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-header text-center">
            <h6 class="my-1"><span class="fw-bold small">Publications per year</span></h6>
          </div>
          <div class="card-body text-center text-muted small d-flex flex-column justify-content-center" id="ra-pubs-chart"></div>
        </div>
      </div>

      <div class="col-12">
        <!-- SILVIA: no p-3 here, so the work cards are as far from the screen
             edge as the document page's ones -->
        <div class="card shadow-sm">

            <div class="card-header text-center">
                 <h4 class="my-1 fw-bold">List of Publications</h4>
            </div>
            
            <div class="card-body p-4">
                <!-- SILVIA (SKG-IF): all the works as compact cards, no pages,
                     first in the API's order (SKG-IF has no sort). The toolbar
                     stays at the top while scrolling; its sort buttons are
                     disabled until every work has arrived (_loadAuthorWorks()) -->
                <div class="ra-toolbar mb-3">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <span class="fw-bold" id="ra-sort-status"></span>
                        <!-- role filter: shown only when the person is author of some
                             works and editor of others (_loadAuthorWorks()) -->
                        <div class="d-flex flex-wrap align-items-center gap-2 d-none" id="ra-role">
                            <span class="small fw-bold">Show:</span>
                            <div class="btn-group btn-group-sm ra-sort" role="group" aria-label="Filter publications by role">
                                <button type="button" class="btn active" data-role="all">All (<span class="ra-role-count"></span>)</button>
                                <button type="button" class="btn" data-role="author">As author (<span class="ra-role-count"></span>)</button>
                                <button type="button" class="btn" data-role="editor">As editor (<span class="ra-role-count"></span>)</button>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <span class="small fw-bold">Sort by:</span>
                            <div class="btn-group btn-group-sm ra-sort" id="ra-sort" role="group" aria-label="Sort publications">
                                <button type="button" class="btn" data-order="newest" disabled>Newest</button>
                                <button type="button" class="btn" data-order="oldest" disabled>Oldest</button>
                                <button type="button" class="btn" data-order="title-asc" disabled>Title A–Z</button>
                                <button type="button" class="btn" data-order="title-desc" disabled>Title Z–A</button>
                                <button type="button" class="btn active" data-order="default" disabled>Default</button>
                            </div>
                        </div>
                    </div>
                    <div class="progress mt-2 d-none" id="ra-progress" style="height: 6px;" role="progressbar" aria-label="Loading publications">
                        <div class="progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="row" id="search-results-container"></div>
            </div>

        </div>
      </div>

      <!-- SILVIA (SKG-IF): shown once the page is scrolled down -->
      <button type="button" class="btn btn-sm ra-top d-none" id="ra-top">&uarr; Back to top</button>

      <footer>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
      </footer>

    </div>
  </body>
</html>
