<html>
  <head>
    <style></style>
  </head>
  <body>

    <br>

    <div class="mb-3">
      <a href="http://127.0.0.1:5500/example/oc/html_template/home.html" class="btn  btn-sm">
        <i class="fas fa-arrow-left"></i> Home
      </a>
    </div>

    <!-- SILVIA (SKG-IF): same layout as Pietro's; the fields are filled by
         api_author_record_skgif() in localbrowser.js (ids below) instead of
         [[Lucinda:...]] SPARQL values -->
    <div class="row">

      <div class="col-12 mb-4">
        <div class="card shadow-sm p-3 h-100">
          <div class="card-header text-center">
            <h3 class="my-0" id="ra-id"></h3>
            <p class="mb-0">Responsible Agent Record</p>
          </div>
        </div>
      </div>

      <!-- errors (no author with this OMID, failed request) -->
      <div class="col-12" id="ra-message"></div>

    </div>

    <div class="row d-none" id="ra-record">

      <div class="col-12 col-md-8 mb-4">
        <div class="card shadow-sm p-3 h-100">
            
            <div class="card-header text-center">
                <h4 class="my-1 fw-bold">Author Profile</h4>
            </div>

            <div class="card-body">
                
            <h5 class="card-title text-center" id="ra-name"></h5>
                <hr>

                <div class="row">

                    <div class="col-12 col-md-6">
                        <span class="metadata-label fw-bold">ORCID:</span>
                        <p id="ra-orcid"></p>

                    </div>

                    <!-- SILVIA (SKG-IF): Pietro's query already read the other
                         identifiers (otherIDs) but did not show them -->
                    <div class="col-12 col-md-6">
                        <span class="metadata-label fw-bold">Other identifiers:</span>
                        <p id="ra-ids"></p>
                    </div>
                </div>


            </div>
        </div>
      </div>


      <div class="col-12 col-md-4 mb-4">
        <div class="card shadow-sm p-1  h-100"> 
          <div class="card-body">

              <div class="row g-3 column-gap-3">
                <div class="col">
                  <div class="card shadow-sm p-1 m-1 h-100">
                      <div class="card-header text-center py-1">
                           <span class="fw-bold small">Publications</span>
                      </div>
                      <div class="card-body text-center">
                        <h3 class="text-primary my-1" id="search-total-count"></h3>
                      </div>
                  </div>
                </div>
              </div>

              <!-- SILVIA (SKG-IF): ON HOLD, to discuss with the prof - Pietro's
                   "Publications per year" chart (barchart_simple(author_works.pubYears)).
                   SKG-IF has no date filter or sort: every work of the author
                   would have to be downloaded (50 per page) to count them by year. -->

          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card shadow-sm p-3">
            
            <div class="card-header text-center">
                 <h4 class="my-1 fw-bold">List of Publications</h4>
            </div>
            
            <div class="card-body p-4">
                <!-- SILVIA (SKG-IF): paginated document cards, in the API's order
                     (SKG-IF has no sort: Pietro's list was by date, newest first) -->
                <div class="row" id="search-results-container"></div>
            </div>

        </div>
      </div>

      <footer>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
      </footer>

    </div>
  </body>
</html>
