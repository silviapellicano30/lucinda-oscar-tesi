<html>
  <head>
    <style></style>
  </head>
  <body>

    <br>
    <div class="mb-3">
      <a href="http://127.0.0.1:5500/example/oc/html_template/home.html" class="btn btn-sm">
        <i class="fas fa-arrow-left"></i> Home
      </a>
    </div>

    <!-- SILVIA (SKG-IF): same layout as Pietro's; the fields are filled by
         api_document_record_skgif() in localbrowser.js (ids below) instead of
         [[Lucinda:...]] SPARQL values. A row with an id "...-row" is shown only
         when its field has a value (as Pietro's ifcond(... !== null)). -->
    <div class="row">

      <div class="col-12 mb-4">
          <div class="card shadow-sm p-3 h-100">
          <div class="card-header text-center">
              <!-- SILVIA (SKG-IF): the document as a reference, one piece of
                   information per line (_skgifHeaderLines()) instead of the OMID -->
              <p class="mb-1 small text-muted">Bibliographic Resource Record</p>
              <div class="skgif-head" id="br-id"></div>
          </div>
          </div>
      </div>

      <!-- errors (no document with this OMID, failed request) -->
      <div class="col-12" id="br-message"></div>

    </div>

    <!-- SILVIA (SKG-IF): layout of 2026-10-17. Header and Home button as
         Pietro's; below, the record (every field of /products) next to the
         counters and the chart, then one card with the References and
         Citations tabs. Filled by api_document_record_skgif() in
         localbrowser.js (ids below); a "...-row" is shown only when its field
         has a value. -->
    <div class="d-none" id="br-record">

    <div class="row">

      <div class="col-12 col-lg-8 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body p-4">

            <h4 class="br-title mb-3" id="br-title"></h4>

            <!-- order of a bibliographic citation (as APA/Chicago): who wrote
                 and edited it; when and what it is; where it was published
                 (source, volume, issue, pages); by whom; its identifiers
                 (DOI first, _skgifIdList()) -->
            <div class="br-field mb-3 d-none" id="br-authors-row">
              <span class="br-label">Authors</span>
              <div id="br-authors"></div>
            </div>

            <div class="br-field mb-3 d-none" id="br-editors-row">
              <span class="br-label">Editors</span>
              <div id="br-editors"></div>
            </div>

            <hr>

            <div class="br-grid">
              <div class="br-field d-none" id="br-date-row"><span class="br-label">Publication date</span><span id="br-date"></span></div>
              <div class="br-field d-none" id="br-type-row"><span class="br-label">Type</span><span id="br-type"></span></div>
              <div class="br-field br-wide d-none" id="br-source-row"><span class="br-label">Source</span><span id="br-source"></span></div>
              <div class="br-field d-none" id="br-volume-row"><span class="br-label">Volume</span><span id="br-volume"></span></div>
              <div class="br-field d-none" id="br-issue-row"><span class="br-label">Issue</span><span id="br-issue"></span></div>
              <div class="br-field d-none" id="br-pages-row"><span class="br-label">Pages</span><span id="br-pages"></span></div>
              <div class="br-field br-wide d-none" id="br-publisher-row"><span class="br-label">Publisher</span><div id="br-publisher"></div></div>
              <div class="br-field br-wide"><span class="br-label">Identifiers</span><span id="br-ids"></span></div>
            </div>

          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body d-flex flex-column gap-3">

            <div class="row g-3">
              <div class="col reference-count">
                <div class="card shadow-sm p-1 h-100">
                  <div class="card-header text-center py-1"><span class="fw-bold small">References</span></div>
                  <div class="card-body text-center"><h3 class="text-primary my-1" id="br-refs-count"></h3></div>
                </div>
              </div>
              <div class="col citation-count">
                <div class="card shadow-sm p-1 h-100">
                  <div class="card-header text-center py-1"><span class="fw-bold small">Citations</span></div>
                  <div class="card-body text-center"><h3 class="text-primary my-1" id="br-cits-count"></h3></div>
                </div>
              </div>
            </div>

            <!-- "Citations per year": drawn from the citations of the list
                 (_brCitationsChart()), by itself or with its "Load chart" button -->
            <div class="card shadow-sm p-1 flex-grow-1">
              <div class="card-header text-center"><h6 class="my-1"><span class="fw-bold small">Citations per year</span></h6></div>
              <div class="card-body text-center text-muted small d-flex flex-column justify-content-center align-items-center" id="br-cits-chart"></div>
            </div>

          </div>
        </div>
      </div>

    </div>

    <div class="row">
      <div class="col-12 mb-4" id="br-lists">
        <div class="card shadow-sm">

          <div class="card-header br-tabs" role="tablist">
            <button type="button" class="br-tab active" role="tab" aria-selected="true" data-br-tab="refs">References (<span id="br-refs-total"></span>)</button>
            <button type="button" class="br-tab" role="tab" aria-selected="false" data-br-tab="cits">Citations (<span id="br-cits-total"></span>)</button>
          </div>

          <div class="card-body p-4">
            <div id="br-refs-pane" role="tabpanel">
              <!-- no "Sort by" (decided 2026-10-17): the list is browsed in the API's order, as on the Go to References page -->
              <div class="ra-toolbar mb-3">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                  <span class="fw-bold" id="br-refs-status"></span>
                </div>
                <div class="progress mt-2 d-none br-chart-progress" id="br-refs-progress" style="height: 6px;" role="progressbar" aria-label="Loading references">
                  <div class="progress-bar" style="width: 0%"></div>
                </div>
              </div>
              <div class="row" id="br-refs-list"></div>
            </div>
            <div id="br-cits-pane" role="tabpanel" class="d-none">
              <!-- no "Sort by" (decided 2026-10-17): the list is browsed in the API's order, as on the Go to Citations page -->
              <div class="ra-toolbar mb-3">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                  <span class="fw-bold" id="br-cits-status"></span>
                </div>
                <div class="progress mt-2 d-none br-chart-progress" id="br-cits-progress" style="height: 6px;" role="progressbar" aria-label="Loading citations">
                  <div class="progress-bar" style="width: 0%"></div>
                </div>
              </div>
              <div class="row" id="br-cits-list"></div>
            </div>

          </div>
        </div>
      </div>
    </div>

    </div>

    <!-- SILVIA (SKG-IF): "Back to top", as in the author profile -->
    <button type="button" class="btn btn-sm ra-top d-none" id="ra-top">&uarr; Back to top</button>

  </body>
</html>
