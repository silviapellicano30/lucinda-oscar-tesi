<!-- SILVIA (SKG-IF): same layout as Pietro's; the fields are filled by
     api_citation_record_skgif() in localbrowser.js (ids below) instead of
     [[Lucinda:...]] SPARQL values -->
<div class="row">

  <!-- TITLE CARD -->
  <div class="col-12 mb-4">
    <div class="card shadow-sm p-3 h-100">
      <div class="card-header text-center">
        <h3 class="my-0" id="ci-oci"></h3>
        <p class="mb-0">Citation Record</p>
      </div>
    </div>
  </div>

  <!-- errors (invalid OCI, missing document...) and the "citation not found" warning -->
  <div class="col-12" id="ci-message"></div>

</div>

<div class="row d-none" id="ci-record">

  <!-- LEFT COLUMN: CITING + CITED -->
  <div class="col-12 col-md-8 mb-4">
    <div class="card shadow-sm p-3 h-100">

      <div class="row">

        <!-- CITING RESOURCE -->
        <div class="col-12 col-md-6 mb-4 mb-md-0">
          <div class="card shadow-sm p-3 h-100">
            <div class="card-header text-center">
              <h4 class="my-1 fw-bold">Citing Resource</h4>
            </div>

            <div class="card-body">

              <h5 class="card-title text-center" id="citing-title"></h5>
              <hr>

              <span class="metadata-label fw-bold" >Authors:</span>
              <p id="citing-authors"></p>

              <span class="metadata-label fw-bold" >Publication Date:</span>
              <p id="citing-date"></p>

              <span class="metadata-label fw-bold" >Identifiers:</span>
              <p id="citing-ids"></p>

              <span class="metadata-label fw-bold">Full URI:</span>
              <p id="citing-uri"></p>

            </div>

            <!-- CITING STATS -->
            <div class="row mt-3 px-3 pb-3">
              <div class="col-6">

                <div class="card shadow-sm p-1 m-1 h-90">
                  <div class="card-header text-center py-1">
                    <span class="fw-bold small">References</span>
                  </div>
                  <div class="card-body text-center">
                    <h3 class="text-primary my-1" id="citing-refs"></h3>
                  </div>
                </div>

              </div>

              <div class="col-6">

                <div class="card shadow-sm p-1 m-1 h-90">
                  <div class="card-header text-center py-1">
                    <span class="fw-bold small">Citations</span>
                  </div>
                  <div class="card-body text-center">
                    <h3 class="text-primary my-1" id="citing-cits"></h3>
                  </div>
                </div>

              </div>
            </div>

          </div>
        </div>


        <!-- CITED RESOURCE -->
        <div class="col-12 col-md-6">
          <div class="card shadow-sm p-3 h-100">
            <div class="card-header text-center">
              <h4 class="my-1 fw-bold">Cited Resource</h4>
            </div>

            <div class="card-body">

              <h5 class="card-title text-center" id="cited-title"></h5>
              <hr>

              <span class="metadata-label fw-bold">Authors:</span>
              <p id="cited-authors"></p>

              <span class="metadata-label fw-bold">Publication Date:</span>
              <p id="cited-date"></p>

              <span class="metadata-label fw-bold">Identifiers:</span>
              <p id="cited-ids"></p>

              <span class="metadata-label fw-bold" >Full URI:</span>
              <p id="cited-uri"></p>

            </div>

            <!-- CITED STATS -->
            <div class="row mt-3 px-3 pb-3">
              <div class="col-6">

                <div class="card shadow-sm p-1 m-1 h-90">
                  <div class="card-header text-center py-1">
                    <span class="fw-bold small">References</span>
                  </div>
                  <div class="card-body text-center">
                    <h3 class="text-primary my-1" id="cited-refs"></h3>
                  </div>
                </div>

              </div>

              <div class="col-6">

                <div class="card shadow-sm p-1 m-1 h-90">
                  <div class="card-header text-center py-1">
                    <span class="fw-bold small">Citations</span>
                  </div>
                  <div class="card-body text-center">
                    <h3 class="text-primary my-1" id="cited-cits"></h3>
                  </div>
                </div>


              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>



  <!-- RIGHT COLUMN: BOTH-SIDE METRICS -->
  <div class="col-12 col-md-4 mb-4">

  <div class="card shadow-sm p-1 h-100">
    <div class="card-body">

      <div class="row g-3 column-gap-3">

        <div class="col">
          <div class="card shadow-sm p-1 m-1 h-100">
            <div class="card-header text-center py-1">
              <span class="fw-bold small">Cited by Both</span>
            </div>
            <div class="card-body text-center">
              <h3 class="text-primary my-1" id="ci-cited-by-both"></h3>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card shadow-sm p-1 m-1 h-100">
            <div class="card-header text-center py-1">
              <span class="fw-bold small">Citing Both</span>
            </div>
            <div class="card-body text-center">
              <h3 class="text-primary my-1" id="ci-citing-both"></h3>
            </div>
          </div>
        </div>

      </div>

      <!-- SILVIA (SKG-IF): ON HOLD, to discuss with the prof - Pietro's two
           "Citations of Citing / Cited per year" charts
           (barchart_from_ids(index2.CitingCitations / CitedCitations)).
           SKG-IF has no date filter: every citing product would have to be
           downloaded (50 per page) to count them by year. -->

    </div>
  </div>
</div>

</div>
