<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link href="../static/css/home.css" rel="stylesheet">
    <style>
      body {
        background-color: #ffffff; 
        min-height: 100vh;         
        display: flex;         
        flex-direction: column;    
        justify-content: center;  
      }
      
      .search-container {
        max-width: 800px;
        width: 100%;              
        margin: 0 auto;           
      }

      
      .btn-purple {
        background-color: #8A2BE2;
        border-color: #8A2BE2;
        color: white;
      }
      .btn-purple:hover {
        background-color: #7a26c9;
        border-color: #7a26c9;
        color: white;
      }

    
      .form-control:focus, .form-select:focus {
        border-color: #8A2BE2;
        box-shadow: 0 0 0 0.25rem rgba(138, 43, 226, 0.25);
      }
    </style>
  </head>

  <body class="container py-4">

    <div class="d-flex justify-content-center mb-4">
      <img src="../static/img/oc-medium.png" alt="OpenCitations Logo" class="img-fluid" style="max-height: 100px;">
    </div>

    <div class="search-bar mb-4 search-container">
      <form id="searchForm">
        
        <div class="input-group">
            
            <select name="category" class="form-select" style="min-width: 222px; background-color: #f8f9fa; justify-content: center;">
              <option value="document">Document Record</option>
              <option value="author">Author Record</option>
              <option value="venue">Venue Record</option>
              <option value="citation">Citation Record</option>
              <option value="doc_cit">Document Citations</option>
              <option value="doc_ref">Document References</option>
             
            </select>

            <input type="text" id="searchQuery" name="query" class="form-control" placeholder="Search..." aria-label="Search" />

            <button type="submit" class="btn btn-purple">
              <i class="fa fa-search"></i>
            </button>
            
        </div>

      </form>
    </div>

    <script src="../static/vendor/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/home.js"></script>

  </body>
</html>
