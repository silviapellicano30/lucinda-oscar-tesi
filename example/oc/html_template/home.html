<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link href="../static/css/home.css" rel="stylesheet">
    <style>
      body {
        background-color: #ffffff; 
        min-height: 100vh;         
        display: flex;         
        flex-direction: column;    
        justify-content: center;  
      }
      
      .search-container {
        max-width: 800px;
        width: 100%;              
        margin: 0 auto;           
      }

      
      .btn-purple {
        background-color: #8A2BE2;
        border-color: #8A2BE2;
        color: white;
      }
      .btn-purple:hover {
        background-color: #7a26c9;
        border-color: #7a26c9;
        color: white;
      }

    
      .form-control:focus, .form-select:focus {
        border-color: #8A2BE2;
        box-shadow: 0 0 0 0.25rem rgba(138, 43, 226, 0.25);
      }
    </style>
  </head>

  <body class="container py-4">

    <div class="d-flex justify-content-center mb-4">
      <img src="../static/img/oc-medium.png" alt="OpenCitations Logo" class="img-fluid" style="max-height: 100px;">
    </div>

    <!-- SILVIA (SKG-IF): search panel, same markup as home2.html, styled in home.css (.oc-search) -->
    <div class="oc-search mb-4 search-container">
      <form id="searchForm" class="oc-search-card">

        <!-- resource type: the hidden select keeps Pietro's logic, the tabs (filled by home.js) drive it -->
        <select name="category" class="d-none" aria-hidden="true" tabindex="-1">
          <option value="document">Document Record</option>
          <option value="author">Author Record</option>
          <option value="venue">Venue Record</option>
          <option value="organisation">Organisation Record</option>
          <option value="citation">Citation Record</option>
          <!-- Document Citations/References removed, reachable only from the document cards -->
        </select>
        <div class="oc-tabs" role="tablist" aria-label="Resource type"></div>

        <div class="oc-search-row">
          <!-- free text (title / name / OCI) or, for authors, given + family name -->
          <div class="oc-field" id="textSide">
            <label class="oc-label" id="textLabel" for="searchQuery">Title</label>
            <div class="oc-input-icon text-field">
              <i class="fa fa-magnifying-glass"></i>
              <input type="text" id="searchQuery" name="query" class="form-control" autocomplete="off" />
            </div>
            <div class="oc-name-fields author-field d-none">
              <input type="text" id="givenName" class="form-control" placeholder="Enter given name" aria-label="Given name" autocomplete="off" />
              <input type="text" id="familyName" class="form-control" placeholder="Enter family name" aria-label="Family name" autocomplete="off" />
            </div>
          </div>

          <div class="oc-or id-field">or</div>

          <!-- identifier: scheme (filled per resource by home.js) + value -->
          <div class="oc-field id-field" id="idSide">
            <label class="oc-label" for="idQuery">Identifier</label>
            <div class="input-group">
              <select id="idScheme" class="form-select" aria-label="Identifier type"></select>
              <input type="text" id="idQuery" class="form-control" autocomplete="off" />
            </div>
          </div>

          <button type="submit" class="btn oc-btn">
            <i class="fa fa-search me-2"></i>Search
          </button>
        </div>

        <div class="oc-hint" id="searchHint" role="alert"></div>

      </form>
    </div>

    <script src="../static/vendor/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/home.js"></script>

  </body>
</html>
